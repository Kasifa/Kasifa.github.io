name: Deploy static research site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Verify publication completeness, links, and bilingual coverage
        run: |
          latest_gate="$(node -p "require('./research/release-manifest.json').latestReleaseGate")"
          latest_publication_test="$(node -p "require('./research/release-manifest.json').latestReleasePublicationTest")"
          test -n "$latest_gate"
          test -n "$latest_publication_test"
          test -f "$latest_gate"
          test -f "$latest_publication_test"
          node --test \
            tests/release-publication-invariant.test.mjs \
            tests/internal-public-links.test.mjs \
            tests/bilingual-content.test.mjs \
            "$latest_gate" \
            "$latest_publication_test"
      - name: Prepare static artifact
        run: |
          mkdir -p _site
          cp -R public/. _site/
          cp public/research-review.html _site/index.html
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
