name: Verify research publication gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-publication-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Use repository Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
      - name: Verify fail-closed publication contract
        run: node scripts/run-release-publication-gate.mjs
