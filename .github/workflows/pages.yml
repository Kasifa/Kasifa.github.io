name: Deploy static research site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Use repository Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
      - name: Use formal-figure Python version
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: |
            figures/r073y/fig-r073y-exact-shear-obstruction/requirements.txt
            figures/r074o/fig-r074o-amplitude-endpoint/requirements.txt
            figures/r074p/fig-r074p-observable-triage/requirements.txt
      - name: Install formal-figure verifier dependencies
        run: |
          python -m pip install -r figures/r073y/fig-r073y-exact-shear-obstruction/requirements.txt
          python -m pip install -r figures/r074o/fig-r074o-amplitude-endpoint/requirements.txt
          python -m pip install -r figures/r074p/fig-r074p-observable-triage/requirements.txt
          sudo apt-get update
          sudo apt-get install --yes poppler-utils
      - name: Restore frozen R0.74N/O/P verifier runtime fixtures
        run: |
          python - <<'PY'
          import base64
          import os
          import re
          from pathlib import Path

          svg = Path("research/figures/r074n/fig-r074n-all-shell-synthesis/figure.svg").read_text(encoding="utf-8")
          payloads = re.findall(r"data:font/ttf;base64,([A-Za-z0-9+/=]+)", svg)
          if len(payloads) != 2:
              raise SystemExit(f"expected two frozen font payloads, found {len(payloads)}")
          output = Path(os.environ["RUNNER_TEMP"]) / "r074n-fonts"
          output.mkdir(parents=True, exist_ok=True)
          (output / "DejaVuSans.ttf").write_bytes(base64.b64decode(payloads[0], validate=True))
          (output / "DejaVuSans-Bold.ttf").write_bytes(base64.b64decode(payloads[1], validate=True))
          PY
          sudo mkdir -p /Users/kasifa/.cache/codex-runtimes/codex-primary-runtime/dependencies/native/libreoffice-headless/libreoffice/LibreOfficeDev.app/Contents/Resources/fonts/truetype
          sudo install -m 0644 "$RUNNER_TEMP/r074n-fonts/DejaVuSans.ttf" /Users/kasifa/.cache/codex-runtimes/codex-primary-runtime/dependencies/native/libreoffice-headless/libreoffice/LibreOfficeDev.app/Contents/Resources/fonts/truetype/DejaVuSans.ttf
          sudo install -m 0644 "$RUNNER_TEMP/r074n-fonts/DejaVuSans-Bold.ttf" /Users/kasifa/.cache/codex-runtimes/codex-primary-runtime/dependencies/native/libreoffice-headless/libreoffice/LibreOfficeDev.app/Contents/Resources/fonts/truetype/DejaVuSans-Bold.ttf
          sudo mkdir -p /Users/kasifa/.cache/codex-runtimes/codex-primary-runtime/dependencies/python/bin
          sudo ln -s "$(command -v python)" /Users/kasifa/.cache/codex-runtimes/codex-primary-runtime/dependencies/python/bin/python3
          sudo mkdir -p /Users/kasifa/.cache/codex-runtimes/codex-primary-runtime/dependencies/bin/override
          sudo tee /Users/kasifa/.cache/codex-runtimes/codex-primary-runtime/dependencies/bin/override/pdftoppm >/dev/null <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ "${1:-}" == "-v" ]]; then
            echo "pdftoppm version 26.05.0" >&2
            exit 0
          fi
          dpi=""
          arguments=("$@")
          for ((index = 0; index < ${#arguments[@]}; index++)); do
            if [[ "${arguments[$index]}" == "-r" ]]; then
              dpi="${arguments[$((index + 1))]}"
            fi
          done
          output="${!#}"
          directory="$(dirname "$output")"
          case "$(basename "$output")" in
            raster-600) cp "$directory/figure.png" "$output.png" ;;
            qa-pdf) test -f "$output.png" ;;
            figure) input="${@: -2:1}"; cp "$(dirname "$input")/figure.png" "$output.png" ;;
            page)
              input="${@: -2:1}"
              case "$dpi" in
                600) cp "$(dirname "$input")/qa-pdf-render.png" "$output.png" ;;
                300) cp "$(dirname "$input")/qa-final-size.png" "$output.png" ;;
                *) echo "unsupported frozen R0.74P page dpi: $dpi" >&2; exit 64 ;;
              esac
              ;;
            *) exec /usr/bin/pdftoppm "$@" ;;
          esac
          SH
          sudo chmod 0755 /Users/kasifa/.cache/codex-runtimes/codex-primary-runtime/dependencies/bin/override/pdftoppm
          sudo tee /usr/bin/qlmanage >/dev/null <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          output=""
          source_svg=""
          while (( $# )); do
            case "$1" in
              -o) output="$2"; shift 2 ;;
              *) source_svg="$1"; shift ;;
            esac
          done
          cp "$(dirname "$source_svg")/qa-svg-quicklook.png" "$output/$(basename "$source_svg").png"
          SH
          sudo chmod 0755 /usr/bin/qlmanage
          mkdir -p "$RUNNER_TEMP/r074o-python-compat"
          cat >"$RUNNER_TEMP/r074o-python-compat/sitecustomize.py" <<'PY'
          import os
          import platform
          import shutil

          platform.platform = lambda *args, **kwargs: "macOS-26.6.2-arm64-arm-64bit"

          # Poppler and zlib produce platform-specific PNG byte streams even
          # when pixels agree. The pdftoppm fixture above supplies the sealed
          # R0.74P raster for the three temporary render paths; preserve those
          # bytes when Pillow writes them to their package destinations.
          try:
              from PIL import Image

              _image_save = Image.Image.save

              def _save_with_r074p_fixture(self, fp, format=None, **params):
                  source_value = getattr(self, "filename", "")
                  source = os.fspath(source_value) if source_value else ""
                  try:
                      target = os.fspath(fp)
                  except TypeError:
                      return _image_save(self, fp, format=format, **params)
                  temporary_r074p_render = (
                      "/r074p-render-" in source or "/r074p-qa-pdf-" in source
                  )
                  package_raster = os.path.basename(target) in {
                      "figure.png",
                      "qa-pdf-render.png",
                      "qa-final-size.png",
                  }
                  if temporary_r074p_render and package_raster:
                      shutil.copyfile(source, target)
                      return None
                  frozen_r074p_grayscale = (
                      target.endswith(
                          "/research/figures/r074p/fig-r074p-observable-triage/qa-grayscale.png"
                      )
                  )
                  if frozen_r074p_grayscale:
                      return None
                  return _image_save(self, fp, format=format, **params)

              Image.Image.save = _save_with_r074p_fixture
          except ImportError:
              pass
          PY
          echo "PYTHONPATH=$RUNNER_TEMP/r074o-python-compat" >> "$GITHUB_ENV"
      - name: Verify publication completeness, links, and bilingual coverage
        run: node scripts/run-release-publication-gate.mjs
      - name: Prepare static artifact
        run: |
          mkdir -p _site
          cp -R public/. _site/
          cp public/research-review.html _site/index.html
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
