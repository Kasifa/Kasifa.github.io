name: Deploy static research site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Use repository Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
      - name: Use formal-figure Python version
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: figures/r073y/fig-r073y-exact-shear-obstruction/requirements.txt
      - name: Install formal-figure verifier dependencies
        run: |
          python -m pip install -r figures/r073y/fig-r073y-exact-shear-obstruction/requirements.txt
          sudo apt-get update
          sudo apt-get install --yes poppler-utils
      - name: Verify publication completeness, links, and bilingual coverage
        run: node scripts/run-release-publication-gate.mjs
      - name: Prepare static artifact
        run: |
          mkdir -p _site
          cp -R public/. _site/
          cp public/research-review.html _site/index.html
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
