name: Verify research publication gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-publication-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Use repository Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
      - name: Use formal-figure Python version
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: figures/r073y/fig-r073y-exact-shear-obstruction/requirements.txt
      - name: Install formal-figure verifier dependencies
        run: python -m pip install -r figures/r073y/fig-r073y-exact-shear-obstruction/requirements.txt
      - name: Verify fail-closed publication contract
        run: node scripts/run-release-publication-gate.mjs
